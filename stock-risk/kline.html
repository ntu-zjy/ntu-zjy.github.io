<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>股票 K 线</title><script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#4f46e5;--up:#ef4444;--down:#16a34a}@media(prefers-color-scheme:dark){:root{--bg:#0d1119;--card:#151b26;--text:#edf2f7;--muted:#9ca8ba;--line:#273142;--accent:#8b83ff;--up:#ff6b6b;--down:#45c486}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}header{padding:28px 0 12px}h1{margin:0 0 6px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.tools{display:grid;grid-template-columns:1.4fr repeat(3,1fr) auto;gap:10px;align-items:end}label span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}button{padding:10px 16px;border:0;border-radius:10px;background:var(--accent);color:white;font-weight:700;cursor:pointer}.error{color:#b42318;font-size:13px;margin-top:8px}#chart{height:620px}.hint{font-size:13px;color:var(--muted);margin-top:8px}@media(max-width:760px){.tools{grid-template-columns:1fr 1fr}.tools button{width:100%}#chart{height:520px}}@media(max-width:480px){.tools{grid-template-columns:1fr}#chart{height:480px}}</style></head><body><header class="wrap"><h1>股票 K 线</h1><div class="muted">沪深 A 股可直接输入 600519、000001；也支持 600519.SH、000001.SZ，以及港股/美股代码。</div></header><main class="wrap"><section class="card"><div class="tools"><label><span>股票代码</span><input id="ticker" value="600519" placeholder="600519 / 000001.SZ / AAPL"></label><label><span>周期</span><select id="period"><option value="day">日 K</option><option value="week">周 K</option><option value="month">月 K</option></select></label><label><span>数量</span><select id="count"><option value="60">60 根</option><option value="120" selected>120 根</option><option value="250">250 根</option></select></label><label><span>复权</span><select id="adjust"><option value="qfq" selected>前复权</option><option value="none">不复权</option></select></label><button id="load">加载 K 线</button></div><div id="error" class="error"></div><div class="hint">A 股按常用习惯：红色上涨、绿色下跌；包含 MA5 / MA17 / MA60 和成交量。MA5 为橙色，MA60 为蓝色。</div></section><section class="card"><div id="chart"></div></section></main><script>const $=id=>document.getElementById(id),chart=echarts.init($('chart'));function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}function norm(raw){let s=String(raw||'').trim().toUpperCase().replace(/\s+/g,'');if(!s)throw Error('请输入股票代码');if(/\.HK$/.test(s))return'hk'+s.replace(/\.HK$/,'').padStart(5,'0');if(/\.(SH|SS)$/.test(s))return'sh'+s.replace(/\.(SH|SS)$/,'');if(/\.SZ$/.test(s))return'sz'+s.replace(/\.SZ$/,'');if(/^(SH|SZ|HK|US)/.test(s))return s.slice(0,2).toLowerCase()+s.slice(2);if(/^[A-Z][A-Z0-9.-]*$/.test(s))return'us'+s;if(/^\d{6}$/.test(s))return/^[569]/.test(s)?'sh'+s:'sz'+s;if(/^\d{3,5}$/.test(s))return'hk'+s.padStart(5,'0');throw Error('无法识别代码格式')}function getData(code,period,count,adjust){return new Promise((ok,fail)=>{const v='kl_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),fq=adjust==='qfq'?'qfq':'';s.src='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?_var='+encodeURIComponent(v)+'&param='+encodeURIComponent(code+','+period+',,,'+count+','+fq)+'&r='+Math.random();s.onload=()=>{try{const p=window[v];s.remove();try{delete window[v]}catch{}const n=p&&p.data&&p.data[code],rows=n&&(n['qfq'+period]||n[period]);if(!Array.isArray(rows)||!rows.length)throw Error('没有返回 K 线数据');ok(rows.map(r=>({date:String(r[0]),open:+r[1],close:+r[2],high:+r[3],low:+r[4],volume:+r[5]})).filter(r=>[r.open,r.close,r.high,r.low].every(Number.isFinite)))}catch(e){fail(e)}};s.onerror=()=>{s.remove();fail(Error('K 线网络请求失败'))};document.head.appendChild(s);setTimeout(()=>{if(s.isConnected){s.remove();fail(Error('K 线请求超时'))}},9000)})}function ma(a,n){return a.map((_,i)=>{if(i<n-1)return'-';let x=0;for(let j=0;j<n;j++)x+=a[i-j].close;return +(x/n).toFixed(3)})}function draw(a){const dates=a.map(x=>x.date),c=a.map(x=>[x.open,x.close,x.low,x.high]),vol=a.map(x=>({value:x.volume,itemStyle:{color:x.close>=x.open?css('--up'):css('--down')}})),start=a.length>100?Math.max(0,100-10000/a.length):0;chart.setOption({animation:false,legend:{top:5,data:['K线','MA5','MA17','MA60']},tooltip:{trigger:'axis',axisPointer:{type:'cross'}},axisPointer:{link:[{xAxisIndex:'all'}]},grid:[{left:65,right:22,top:48,height:'62%'},{left:65,right:22,top:'76%',height:'12%'}],xAxis:[{type:'category',data:dates,boundaryGap:true,axisLabel:{color:css('--muted')}},{type:'category',gridIndex:1,data:dates,boundaryGap:true,axisLabel:{show:false},axisTick:{show:false}}],yAxis:[{scale:true,axisLabel:{color:css('--muted')},splitLine:{lineStyle:{color:css('--line')}}},{scale:true,gridIndex:1,splitNumber:2,axisLabel:{color:css('--muted'),formatter:v=>Intl.NumberFormat('zh-CN',{notation:'compact',maximumFractionDigits:1}).format(v)},splitLine:{show:false}}],dataZoom:[{type:'inside',xAxisIndex:[0,1],start,end:100},{type:'slider',xAxisIndex:[0,1],bottom:5,start,end:100,height:20}],series:[{name:'K线',type:'candlestick',data:c,itemStyle:{color:css('--up'),color0:css('--down'),borderColor:css('--up'),borderColor0:css('--down')}},{name:'MA5',type:'line',data:ma(a,5),showSymbol:false,smooth:true,lineStyle:{width:1.6,color:'#f59e0b'}},{name:'MA17',type:'line',data:ma(a,17),showSymbol:false,smooth:true,lineStyle:{width:1.4}},{name:'MA60',type:'line',data:ma(a,60),showSymbol:false,smooth:true,lineStyle:{width:1.7,color:'#2563eb'}},{name:'成交量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:vol}]},true)}async function load(){const b=$('load');$('error').textContent='';b.disabled=true;b.textContent='加载中…';try{const code=norm($('ticker').value),rows=await getData(code,$('period').value,+$('count').value,$('adjust').value);draw(rows);history.replaceState(null,'','?code='+encodeURIComponent($('ticker').value))}catch(e){$('error').textContent=e.message||String(e);chart.clear()}finally{b.disabled=false;b.textContent='加载 K 线'}}$('load').onclick=load;$('ticker').onkeydown=e=>{if(e.key==='Enter')load()};['period','count','adjust'].forEach(id=>$(id).onchange=load);addEventListener('resize',()=>chart.resize());const q=new URLSearchParams(location.search).get('code');if(q)$('ticker').value=q;load();</script></body></html>
